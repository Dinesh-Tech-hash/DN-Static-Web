<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sample Webpage</title>
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <h1>Welcome to My Website</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section id="about">
      <h2>About Us</h2>
      <p>This is a sample paragraph showing how text is structured in HTML. You can easily add <strong>bold text</strong> or <em>italicized words</em>.</p>
      <img src="https://placeholder.com" alt="Placeholder sample image">
    </section>

    <section id="contact">
      <h2>Contact Form</h2>
      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 My Sample Website. All rights reserved.</p>
  </footer>

</body>
</html>
